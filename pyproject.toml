[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-note-coach"
version = "0.0.1"
description = "Feedback on spoken voice notes: pace, filler words, pauses, run-ons."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
